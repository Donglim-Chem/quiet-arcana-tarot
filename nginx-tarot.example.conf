# Example Nginx configuration for the Tarot site (frontend + AI reading proxy).
# Adjust server_name, alias paths, and the backend port to match your deployment.

# Rate limiting for the AI reading endpoint.
limit_req_zone $binary_remote_addr zone=tarot_ai:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name your-domain-or-ip;        # <-- change this

    location = /tarot {
        return 301 /tarot/;
    }

    # AI reading proxy -> local Python backend (see server.py / tarot-ai.service)
    location = /tarot/api/reading {
        limit_req zone=tarot_ai burst=3 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8012/reading;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # Static frontend
    location /tarot/ {
        charset utf-8;
        alias /var/www/html/tarot/;       # <-- change this
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}